name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ci-test-secret-key
      DEBUG: "True"
      # Sem PostgreSQL disponível no runner, core/settings.py cai automaticamente
      # para SQLite (ver função _postgres_reachable) — nenhuma configuração extra
      # de base de dados é necessária aqui.

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Testes automatizados
        run: python manage.py test recruitment
